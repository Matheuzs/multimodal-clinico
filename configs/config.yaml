# Limiares e parâmetros do MVP (ajustados nas tasks seguintes)
paths:
  raw: data/raw
  samples: data/samples
  outputs: outputs

ingestion:
  video_exts: [.mp4, .avi, .mov]
  image_exts: [.jpg, .jpeg, .png]
  audio_exts: [.wav, .mp3, .flac, .m4a]
  max_video_seconds: 120
  target_audio_sr: 16000

vision:
  pose_model_complexity: 1
  min_detection_confidence: 0.5
  frame_stride: 3          # analisa 1 a cada N frames
  process_width: 640       # redimensiona antes do MediaPipe (acelera; landmarks são normalizados)
  annotate_width: 960      # largura do vídeo anotado
  thresholds:
    visibility_min: 0.5
  # Regras para o Ex1 do REHAB24-6 (abdução lateral do braço direito esticado).
  # O dataset não define o que é "incorreto" e o erro varia por pessoa, então a avaliação principal
  # é RELATIVA: compara cada repetição com a linha de base da própria pessoa (primeiras repetições).
  # Limiares relativos escolhidos olhando PM_001 e PM_012 (10 repetições cada): validar em outros vídeos.
  exercise:
    rep_start_deg: 40         # ombro direito sobe acima disso -> início da repetição
    rep_end_deg: 30           # volta abaixo disso -> fim
    rep_min_peak_deg: 60      # picos menores são ruído, não repetição
    smooth_window: 3          # média móvel (frames amostrados)
    baseline_reps: 3          # nº de repetições iniciais usadas como referência (mediana)
    rel_peak_pct: 10          # desvio de amplitude (pico do ombro) vs. linha de base, em %
    rel_speed_pct: 35         # desvio da velocidade de subida, em %
    rel_elbow_deg: 10         # desvio do cotovelo mínimo vs. linha de base, em graus
    # Regras absolutas (clinicamente plausíveis; null desliga). Amplitude absoluta desligada:
    # não generalizou entre pessoas (PM_001 vs PM_012).
    min_peak_shoulder_deg: null
    min_elbow_deg: 140        # cotovelo mais dobrado que isso = braço não esticado
    max_other_shoulder_range_deg: 20   # movimento do ombro oposto = compensação de tronco
    min_detected_ratio: 0.8   # qualidade: fração de frames com pose

audio:
  whisper_model: small
  language: en
  vad:
    top_db: 35              # fala = até 35 dB abaixo do percentil 95 (F1 0,86-0,91 vs TextGrid)
    min_gap_s: 0.25         # silêncio menor que isso não conta como pausa
    turn_gap_s: 5.0         # sem canal do médico: silêncios maiores que isso = troca de turno, não pausa
  # Limiares dos indicadores acústicos: escolhidos a priori, um pouco além da faixa observada em 5
  # consultas simuladas (atores saudáveis: 2,7-3,5 palavras/s; 1-1,9 pausas longas/min; 8-23 % de pausa).
  # NÃO são validados clinicamente (o PriMock57 não tem rótulo de fadiga): indicam desvio do padrão
  # conversacional típico, não diagnóstico.
  thresholds:
    long_pause_s: 1.5            # pausa longa
    max_long_pauses_per_min: 2.5
    max_pause_ratio: 0.30        # fração do tempo ativo em pausa
    low_speech_rate_wps: 2.0     # palavras por segundo de fala (sem pausas)
    energy_drop_db: 6            # queda de energia entre o 1º e o último terço da fala
  # Dicionário de termos clínicos (inglês). severity: high | medium | low. Padrões são frases/raízes
  # sem distinção de maiúsculas; termos negados ("no chest pain") não geram alerta.
  critical_terms:
    chest_pain:
      severity: high
      patterns: [chest pain, pain in my chest, chest tightness, tight chest, pressure in my chest, chest hurts]
    breathing_difficulty:
      severity: high
      patterns: [shortness of breath, short of breath, breathless, difficulty breathing, trouble breathing,
                 can't breathe, cannot breathe, hard to breathe, struggling to breathe, wheez]
    fainting:
      severity: high
      patterns: [faint, passed out, blacked out, lost consciousness, collapsed]
    neurological:
      severity: high
      patterns: [slurred speech, difficulty speaking, trouble speaking, face drooping, numbness, can't feel]
    severe_pain:
      severity: high
      patterns: [severe pain, unbearable pain, worst pain, excruciating, agony]
    bleeding:
      severity: high
      patterns: [bleeding, blood in my, blood in the, coughing up blood, vomiting blood, vomited blood, bloody]
    dizziness:
      severity: medium
      patterns: [dizzy, dizziness, lightheaded, light-headed, vertigo, room is spinning]
    fever:
      severity: medium
      patterns: [fever, feverish, chills, high temperature]
    vomiting:
      severity: medium
      patterns: [vomit, throwing up, can't keep anything down]
    palpitations:
      severity: medium
      patterns: [palpitation, heart racing, racing heart, heart pounding, irregular heartbeat]
    fatigue:
      severity: medium
      patterns: [exhausted, fatigue, tired, no energy, worn out, weak]
    dehydration:
      severity: medium
      patterns: [dehydrat]
    gi_symptoms:
      severity: low
      patterns: [diarrhea, diarrhoea, loose stool, watery stool, nausea, nauseous, stomach pain, abdominal pain]
    pain:
      severity: low
      patterns: [pain, painful, hurts, aching]
    other_symptoms:
      severity: low
      patterns: [headache, cough, rash, itchy, itching, sore throat]
  # Sentimento: o modelo padrão (SST-2) mede tom negativo/positivo, não humor clínico; frases como
  # "I have pain" saem negativas. Só gera achado de severidade baixa. Limiar não validado.
  sentiment:
    model: null                 # null = padrão do pipeline (distilbert SST-2, aula 06)
    negative_score_min: 0.9     # confiança mínima para contar uma frase como negativa
    max_negative_ratio: 0.6     # fração de frases negativas acima da qual há achado
    min_segments: 5

fusion:
  severity_weights: {low: 1, medium: 2, high: 3}
  alert_threshold: 4
